AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: XroniX - Xのメンション・返信管理（VPCなし、東京リージョン）

Parameters:
  AdminEmail:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    ConstraintDescription: メールアドレスの形式で指定する
    Description: ログインに使うメールアドレス（ログインIDを兼ねる）。デプロイのワークフローが、GitHubのシークレット ADMIN_EMAIL から渡す。リポジトリには書かない
  SsmPrefix:
    Type: String
    Default: /xronix/
    Description: 秘密情報を置くSSMパラメータの接頭辞

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        XRONIX_TABLE: !Ref Table
        XRONIX_SSM_PREFIX: !Ref SsmPrefix
        XRONIX_COGNITO_CLIENT_ID: !Ref UserPoolClient
        XRONIX_ADMIN_EMAIL: !Ref AdminEmail
        # 次回実行の登録（EventBridge Scheduler）。循環参照を避けるため、ARNは名前から組み立てる
        XRONIX_JOB_ARN: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-job
        XRONIX_SCHEDULER_ROLE_ARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-scheduler
        XRONIX_SCHEDULE_PREFIX: !Ref AWS::StackName

Resources:
  # ---------- データ ----------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # 総当たりの抑制（受付の速さを絞る）。ログインの試行は、Cognito側でも制限される
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      # ログインで得たIDトークン（JWT）を、API Gatewayが検証する。Xのコールバックとログイン設定だけは認証なし（下のPublicイベント）
      Auth:
        DefaultAuthorizer: Jwt
        Authorizers:
          Jwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  # ---------- ログイン（Cognito。1人用） ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # 自己登録は無効。ユーザーは、このスタックが1人だけ作る
        InviteMessageTemplate:
          EmailSubject: XroniX の初回ログイン
          EmailMessage: "XroniX の初回ログインの情報です。ログインID: {username} 仮パスワード: {####} ログイン画面で入力すると、新しいパスワードの設定に進みます。"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}   # パスワード忘れは、メールの確認コードで再設定する
      EmailConfiguration: {EmailSendingAccount: COGNITO_DEFAULT}
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: XroniX のパスワード再設定コード
        EmailMessage: "XroniX のパスワード再設定の確認コード: {####} 心当たりがない場合は、このメールを無視してください。"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}

  # ログインするのは、この1人だけ。仮パスワードが、このメールアドレスに届く
  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - {Name: email, Value: !Ref AdminEmail}
        - {Name: email_verified, Value: "true"}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: xronix.lambda_handlers.api_handler
      Timeout: 30
      LoggingConfig: {LogGroup: !Ref ApiLogs}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:PutParameter, ssm:DeleteParameter]
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}*
        - Statement:
            - Sid: RegisterNextRun
              Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AWS::StackName}-next-*
            - Sid: PassSchedulerRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-scheduler
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
            - Sid: BedrockListModels
              Effect: Allow
              Action: [bedrock:ListFoundationModels, bedrock:ListInferenceProfiles, bedrock:GetFoundationModelAvailability]
              Resource: "*"
            - Sid: BedrockInvoke
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        # 認証は、API GatewayのJWT検証（直接のAPI URLにも効く）。Lambdaでも、検証済みの印があるかを確認する
        Proxy:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: "/api/{proxy+}", Method: ANY}
        # 認証なし: Xのコールバック（stateで保護）と、ログイン画面が使う設定（公開してよい値だけ）
        PublicCallback:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/x/callback, Method: GET, Auth: {Authorizer: NONE}}
        PublicAuthConfig:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /api/auth-config, Method: GET, Auth: {Authorizer: NONE}}

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 14}

  # ---------- 定期処理 ----------
  # 実行時刻は、ジョブ自身が毎回「秒単位の一回限りのスケジュール」として登録する（間隔1〜999分、ランダムなずらし対応）。
  # 下の15分ごとの起動は「見守り」で、予定が2分以上遅れているときだけ代わりに実行する。
  JobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-job
      Handler: xronix.lambda_handlers.job_handler
      Timeout: 300
      LoggingConfig: {LogGroup: !Ref JobLogs}
      # 失敗時にLambdaが自動で再実行しない（二重処理を避ける）
      EventInvokeConfig: {MaximumRetryAttempts: 0}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:PutParameter, ssm:DeleteParameter]
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}*
        - Statement:
            - Sid: RegisterNextRun
              Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AWS::StackName}-next-*
            - Sid: PassSchedulerRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-scheduler
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
            - Sid: BedrockListModels
              Effect: Allow
              Action: [bedrock:ListFoundationModels, bedrock:ListInferenceProfiles, bedrock:GetFoundationModelAvailability]
              Resource: "*"
            - Sid: BedrockInvoke
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        Watchdog:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            Input: '{"watchdog": true}'

  JobLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 14}

  # EventBridge Schedulerが、予定時刻にジョブを起動するためのロール
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-job
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-job

  # ---------- 画面の配信（S3＋CloudFront。/api/* は同じドメインでAPIへ） ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad            # CachingDisabled
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  XCallbackUrl:
    Description: Xの開発者コンソールに登録するコールバックURL
    Value: !Sub https://${Distribution.DomainName}/api/x/callback
  SiteBucketName:
    Value: !Ref SiteBucket
  ApiFunctionName:
    Value: !Ref ApiFunction
  UserPoolId:
    Description: ログインのユーザープール（パスワードの再発行などで使う）
    Value: !Ref UserPool
