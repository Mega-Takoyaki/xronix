<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XroniX 管理画面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232563eb%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27700%27%3EX%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">XroniX <span id="mode" class="badge"></span></div>
  <div id="chips"></div>
  <button id="kill" class="kill"></button>
</header>
<div id="banner" class="banner" hidden></div>
<nav id="tabs">
  <button data-tab="queue">承認待ち <span id="n-queue" class="count"></span></button>
  <button data-tab="history">履歴</button>
  <button data-tab="rules">ルール</button>
  <button data-tab="templates">定型文</button>
  <button data-tab="jobs">ジョブ</button>
  <button data-tab="stats">統計・ログ</button>
  <button data-tab="settings">設定</button>
</nav>
<main id="view"></main>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
