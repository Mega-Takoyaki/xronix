name: deploy-staging

# mainへのpushで、テスト → 検証環境へデプロイ → 動作確認 まで自動で行う。
# GitHubの Environment「staging」に、変数 AWS_ROLE_ARN・ARTIFACT_BUCKET と、
# シークレット ADMIN_EMAIL（ログインに使うメールアドレス。リポジトリには書かない）を設定しておくこと（docs/guide/aws-staging-setup.md）。
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "template.yaml"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STACK: xronix-staging
  AWS_REGION: ap-northeast-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: ログイン用のメールアドレスを確認する
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          # 未設定のままデプロイすると、ログインできるユーザーが作られず、画面に入れなくなる。その前に止める
          test -n "$ADMIN_EMAIL" || { echo "::error::シークレット ADMIN_EMAIL が未設定です（ログインに使うメールアドレス）"; exit 1; }
          echo "::add-mask::$ADMIN_EMAIL"

      - run: sam build

      - name: デプロイ
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          sam deploy \
            --stack-name "$STACK" \
            --s3-bucket "$ARTIFACT_BUCKET" --s3-prefix "$STACK" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides "AdminEmail=$ADMIN_EMAIL"

      - name: スタックの出力を読む
        id: out
        run: |
          q() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "site=$(q SiteUrl)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(q SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "callback=$(q XCallbackUrl)" >> "$GITHUB_OUTPUT"

      - name: 画面を配信する（S3へ同期）
        run: aws s3 sync web "s3://${{ steps.out.outputs.bucket }}" --delete

      - name: 動作確認
        env:
          SITE: ${{ steps.out.outputs.site }}
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          for i in 1 2 3 4 5 6; do [ "$(code "$SITE/api/status")" = "401" ] && break; sleep 10; done
          echo "ログインなし（API）:       $(code "$SITE/api/status")   期待: 401"
          echo "ログインなし（POST）:      $(code -X POST -H 'X-Requested-With: xronix' "$SITE/api/kill")   期待: 401"
          echo "ログイン画面:             $(code "$SITE/")   期待: 200"
          echo "ログイン設定（公開）:      $(code "$SITE/api/auth-config")   期待: 200"
          [ "$(code "$SITE/api/status")" = "401" ]
          [ "$(code -X POST -H 'X-Requested-With: xronix' "$SITE/api/kill")" = "401" ]
          [ "$(code "$SITE/")" = "200" ]
          curl -sf "$SITE/api/auth-config" | tee /tmp/authcfg.json
          python3 -c 'import json; d=json.load(open("/tmp/authcfg.json")); assert d["enabled"] and d["client_id"] and d["region"], d'

      - name: 結果の要約
        run: |
          {
            echo "### 検証環境へのデプロイが完了しました"
            echo "- 画面: ${{ steps.out.outputs.site }}"
            echo "- Xのコールバック URL（Xの開発者コンソールに登録）: ${{ steps.out.outputs.callback }}"
          } >> "$GITHUB_STEP_SUMMARY"
